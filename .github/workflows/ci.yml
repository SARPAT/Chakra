name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Package smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check package (zero deps, exports, size)
        run: npm run check:package

      - name: Pack tarball
        id: pack
        run: |
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          echo "Packed $RUNNER_TEMP/$tarball"
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"

      - name: Install tarball into a fresh project
        id: consumer
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          dir="$RUNNER_TEMP/consumer"
          mkdir -p "$dir"
          cd "$dir"
          npm init -y
          npm install "$TARBALL"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Require installed package
        working-directory: ${{ steps.consumer.outputs.dir }}
        run: node -e "require('chakra-middleware')"

      - name: Run installed CLI
        working-directory: ${{ steps.consumer.outputs.dir }}
        run: npx --no-install chakra --help

      - name: Verify non-TS assets from src/ are shipped in dist/
        env:
          PKG_DIR: ${{ steps.consumer.outputs.dir }}/node_modules/chakra-middleware
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            rel="${f#src/}"
            if [ -f "$PKG_DIR/dist/$rel" ]; then
              echo "ok: dist/$rel"
            else
              echo "::error file=$f::$f is missing from the packed package (expected dist/$rel)"
              missing=1
            fi
          done < <(find src -type f ! -name '*.ts' ! -name '*.tsx' ! -name '*.mts' ! -name '*.cts' -print0)
          exit "$missing"
